name: team_sync
description: "TeamSync - Soccer Analytics"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.12.1+136

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  js: ^0.6.7
  sqflite: ^2.3.3+1
  intl: ^0.20.2
  path_provider: ^2.1.4
  external_path: ^2.1.1
  permission_handler: ^12.0.1
  responsive_framework: ^1.5.1
  eventify: ^1.0.1
  auto_size_text: ^3.0.0
  change_case: ^2.2.0
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.3
  firebase_core: ^4.2.0
  firebase_database: ^12.0.4
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.4
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.0
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.2.3
  encrypt: ^5.0.3
  showcaseview: ^5.0.1
  go_router: ^14.2.1
  flutter_markdown: ^0.7.1

  purchases_flutter: ^9.8.0
  purchases_ui_flutter: ^9.8.0

  speech_to_text: ^7.3.0

  twitter_webview_auth: ^0.2.0
  dart_twitter_api: ^0.6.0
  firebase_analytics: ^12.0.3
  provider: ^6.1.5+1
  image_picker: ^1.1.2
  firebase_storage: ^13.0.4
  photo_view: ^0.15.0
  carousel_slider: ^5.0.0

  flutter_dotenv: ^5.0.2
  web: ^1.1.1
  webview_flutter: ^4.0.7
  crypto: ^3.0.7
  sign_in_with_apple: ^7.0.1
  share_plus: ^12.0.1
  csv: ^6.0.0
  video_player: ^2.10.1
  qr_flutter: ^4.1.0
  http: ^1.6.0
  integration_test:
    sdk: flutter
  table_calendar: ^3.2.0
  html: ^0.15.6
  universal_io: ^2.3.1

  # keep dev deps below

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  firebase_core_platform_interface: ^6.0.2
  firebase_auth_platform_interface: ^8.1.4
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true # To keep your Android icon
  ios: true     # To generate iOS icons
  # image_path: "assets/images/pngs/soccer_icon_no_background.png" # Path to your high-res icon
  image_path: "assets/images/pngs/basketball_icon_no_background.png" # Path to your high-res icon
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/pngs/
    - assets/images/jpgs/
    - assets/PRIVACY_POLICY.md
    - assets/TERMS_OF_USE.md
    - .env

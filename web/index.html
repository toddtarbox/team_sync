<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Soccer stat tracking and analytics.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="team_sync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png"/>

  <!-- Force cache refresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>TeamSync - Soccer Stats & Analytics</title>
  <meta name="description" content="Professional soccer stat tracking and analytics for teams and players. Manage seasons, track games, and visualize performance.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://teamsync.app/">
  <meta property="og:title" content="TeamSync - Soccer Stats & Analytics">
  <meta property="og:description" content="Professional soccer stat tracking and analytics for teams and players.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://teamsync.app/">
  <meta property="twitter:title" content="TeamSync - Soccer Stats & Analytics">
  <meta property="twitter:description" content="Professional soccer stat tracking and analytics for teams and players.">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#4CAF50">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

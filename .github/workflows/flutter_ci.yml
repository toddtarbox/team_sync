name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Pin value for Flutter stable release tag — change this if you want a different stable release
# Assumption: using tag '3.13.0' as a representative stable release; update if you prefer another tag
env:
  FLUTTER_PINNED_TAG: "3.13.0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI debug: runner info
        run: |
          set -euo pipefail
          echo "==== PATH ===="
          echo "$PATH"
          echo "==== env (filtered) ===="
          env | egrep '(^PATH=|FLUTTER|GITHUB|RUNNER|HOME)' || true
          echo "==== which flutter ===="
          which flutter || true
          echo "==== OS release ===="
          cat /etc/os-release || true
        shell: bash
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        id: flutter-cache
        with:
          path: $HOME/flutter
          key: flutter-${{ runner.os }}-v${{ env.FLUTTER_PINNED_TAG }}
      - name: Clone Flutter SDK (cache miss)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Cache miss — cloning Flutter ${FLUTTER_PINNED_TAG}"
          rm -rf "$HOME/flutter" || true
          git clone https://github.com/flutter/flutter.git --branch "${FLUTTER_PINNED_TAG}" --depth 1 "$HOME/flutter"
        shell: bash
      - name: Setup Flutter environment
        run: |
          set -euo pipefail
          export FLUTTER_ROOT="$HOME/flutter"
          echo "$FLUTTER_ROOT/bin" >> $GITHUB_PATH
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter --version
          flutter precache --web
          flutter doctor -v
        shell: bash
      - name: Cache pub cache
        uses: actions/cache@v4
        id: pub-cache
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --no-pub

  build_web:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - name: CI debug: runner info
        run: |
          set -euo pipefail
          echo "==== PATH ===="
          echo "$PATH"
          echo "==== env (filtered) ===="
          env | egrep '(^PATH=|FLUTTER|GITHUB|RUNNER|HOME)' || true
          echo "==== which flutter ===="
          which flutter || true
          echo "==== OS release ===="
          cat /etc/os-release || true
        shell: bash
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        id: flutter-cache
        with:
          path: $HOME/flutter
          key: flutter-${{ runner.os }}-v${{ env.FLUTTER_PINNED_TAG }}
      - name: Clone Flutter SDK (cache miss)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "Cache miss — cloning Flutter ${FLUTTER_PINNED_TAG}"
          rm -rf "$HOME/flutter" || true
          git clone https://github.com/flutter/flutter.git --branch "${FLUTTER_PINNED_TAG}" --depth 1 "$HOME/flutter"
        shell: bash
      - name: Setup Flutter environment
        run: |
          set -euo pipefail
          export FLUTTER_ROOT="$HOME/flutter"
          echo "$FLUTTER_ROOT/bin" >> $GITHUB_PATH
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          flutter --version
          flutter precache --web
          flutter doctor -v
        shell: bash
      - name: Cache pub cache
        uses: actions/cache@v4
        id: pub-cache
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
      - name: Install dependencies
        run: flutter pub get
      - name: Build web (release) with Firebase env from Secrets
        # Provide required Firebase values via repository secrets (see README/docs)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_DATABASE_URL="$FIREBASE_DATABASE_URL" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_MEASUREMENT_ID="$FIREBASE_MEASUREMENT_ID"

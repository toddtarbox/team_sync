name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scan (grep-based)
        run: |
          set -euo pipefail
          chmod +x scripts/ci/secret_scan.sh
          ./scripts/ci/secret_scan.sh

      - name: Run gitleaks scan (robust secrets scanner)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
